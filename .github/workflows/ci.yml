name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # Includes the structured-output schema lint (packages/pipelines/test).
      - run: pnpm test
      - run: pnpm build
      - name: End-to-end (Electron, fake agent)
        run: xvfb-run -a pnpm --filter @legible/desktop exec playwright test

  # Releases are built on macOS, and the app's main platform is macOS: run the
  # tests there too (symlinked temp dirs, FSEvents watching, Meta shortcuts),
  # and package the app unsigned so builder config problems show up before a
  # release does.
  check-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: End-to-end (Electron, fake agent)
        run: pnpm --filter @legible/desktop exec playwright test
      - name: Package the app, unsigned
        run: pnpm --filter @legible/desktop exec electron-builder --mac --dir --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
